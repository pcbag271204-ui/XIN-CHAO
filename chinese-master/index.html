
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Master</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="logo">中</div>
            <div>
                <h1>Chinese Master</h1>
                <p>Học tiếng Trung mỗi ngày</p>
            </div>
        </header>

        <section class="settings card">
            <div class="field">
                <label for="lessonSelect">Chọn bài học</label>
                <select id="lessonSelect">
                    <option value="all">Tất cả từ vựng</option>
                    <option value="1">Bài 1</option>
                    <option value="2">Bài 2</option>
                    <option value="3">Bài 3</option>
                    <option value="4">Bài 4</option>
                    <option value="5">Bài 5</option>
                    <option value="6">Bài 6</option>
                    <option value="7">Bài 7</option>
                    <option value="H2-1">H2-1</option>
                </select>
            </div>

            <div class="field">
                <label for="practiceMode">Chế độ luyện tập</label>
                <select id="practiceMode">
                    <option value="random">Ngẫu nhiên</option>
                    <option value="hanzi">Chữ Hán → Pinyin</option>
                    <option value="meaning">Nghĩa → Chữ Hán</option>
                    <option value="pinyin">Pinyin → Nghĩa</option>
                </select>
            </div>
        </section>

        <section class="progress-section">
            <div class="progress-info">
                <span>Tiến độ</span>
                <span id="progressText">0 / 0 từ</span>
            </div>
            <div class="progress-track">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <p id="totalText" class="total-text">Trả lời đúng: 0 / 0 từ</p>
        </section>

        <section class="question-card card">
            <div class="question-top">
                <span class="question-label">CÂU HỎI</span>
                <span class="status-dot"></span>
            </div>

            <p id="questionType" class="question-type">
                Nhìn câu hỏi và nhập đáp án
            </p>

            <div id="hanziText" class="question-word">你好</div>

            <p id="hintText" class="hint"></p>

            <form id="answerForm">
                <label for="userInput" class="input-label">
                    Câu trả lời của bạn
                </label>

                <input
                    id="userInput"
                    type="text"
                    placeholder="Nhập đáp án..."
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false"
                >

                <p id="feedbackText" class="feedback" aria-live="polite"></p>

                <div class="buttons">
                    <button id="checkBtn" type="submit" class="btn primary">
                        Kiểm tra
                    </button>
                    <button id="skipBtn" type="button" class="btn secondary">
                        Bỏ qua
                    </button>
                </div>
            </form>
        </section>

        <footer>
            <p>Chinese Master · Luyện từ vựng tiếng Trung</p>
        </footer>
    </main>
</body>
</html>
